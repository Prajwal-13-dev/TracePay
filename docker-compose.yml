services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tracepay-postgres
    environment:
      POSTGRES_USER: tracepay_owner
      POSTGRES_PASSWORD: ${PG_OWNER_PASSWORD}
      POSTGRES_DB: tracepay
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracepay_owner -d tracepay"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata: {}
